# Render Blueprint：一键部署后端 API（生产环境）
# 使用方式：Render 控制台 → New → Blueprint → 选择本仓库 → 按提示填写 sync:false 的环境变量
services:
  - type: web
    name: fangnale-api
    runtime: node
    region: singapore        # 离国内最近且免备案
    plan: free               # 免费档；后续可升级 $7/月去除休眠
    buildCommand: corepack enable && pnpm install --frozen-lockfile --filter server... && pnpm --filter server run build
    startCommand: node server/dist/index.js
    healthCheckPath: /api/v1/health
    autoDeploy: true         # 推送到 main 分支自动重新部署
    envVars:
      - key: NODE_ENV
        value: production    # production 下 dev-activate 测试接口自动禁用
      - key: PORT
        value: "9091"
      # ===== 以下在 Render 控制台部署时填写（sync:false 表示需手动输入，不会入库）=====
      - key: COZE_SUPABASE_URL
        sync: false
      - key: COZE_SUPABASE_ANON_KEY
        sync: false
      - key: COZE_SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # ===== 火山引擎 =====
      - key: ARK_API_KEY
        sync: false
      - key: ARK_MODEL
        value: doubao-seed-2-1-turbo-260628
      - key: TOS_ACCESS_KEY_ID
        sync: false
      - key: TOS_SECRET_ACCESS_KEY
        sync: false
      - key: TOS_BUCKET
        value: fangnale-photos
      - key: TOS_REGION
        value: cn-beijing
      - key: TOS_ENDPOINT
        value: https://tos-s3-cn-beijing.volces.com
      - key: VOLC_SPEECH_API_KEY
        sync: false   # 豆包语音新版控制台「API Key 管理」中的 Key
